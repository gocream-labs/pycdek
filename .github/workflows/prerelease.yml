# Единый воркфлоу предварительных релизов.
# Ручной запуск из рабочей ветки выпускает beta; push в next выпускает RC
# и обновляет документацию next.

name: Prerelease

on:
  push:
    branches:
      - next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  # Push в next даёт rc, ручной запуск из рабочей ветки - beta.
  setup:
    name: Select prerelease channel
    runs-on: ubuntu-latest

    outputs:
      channel: "${{ steps.channel.outputs.channel }}"

    steps:
      - name: Setup | Select prerelease channel
        id: channel
        env:
          EVENT_NAME: "${{ github.event_name }}"
          RELEASE_BRANCH: "${{ github.ref_name }}"
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            CHANNEL=rc
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$RELEASE_BRANCH" = "master" ] || [ "$RELEASE_BRANCH" = "next" ]; then
              echo "::error::Beta releases must use a working branch, not $RELEASE_BRANCH"
              exit 1
            fi
            CHANNEL=beta
          else
            echo "::error::Unsupported prerelease event: $EVENT_NAME"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Prerelease channel: $CHANNEL"

  # Гейт для rc: через workflow_call, потому что результат нужен джобе build.
  tests:
    name: Test prerelease candidate
    needs: setup
    if: needs.setup.outputs.channel == 'rc'
    uses: ./.github/workflows/ci.yml
    with:
      run_tests: true
      run_package: false
      run_lint: false
      run_docs: false
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
    permissions:
      contents: read

  # Версия и тег предрелиза без коммита в ветку: что бы не создавать лишние коммиты и незагрязнять
  # рабочую ветку.
  build:
    name: Build, Version & Tag [Prerelease]
    needs:
      - setup
      - tests
    # Beta intentionally skips tests; RC proceeds only after successful tests.
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.setup.outputs.channel == 'beta' || needs.tests.result == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      release_notes: "${{ steps.release.outputs.release_notes }}"
      released: "${{ steps.release.outputs.released }}"
      tag: "${{ steps.release.outputs.tag }}"
      version: "${{ steps.release.outputs.version }}"

    steps:
      - name: Setup | Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 0
          token: "${{ github.token }}"

      - name: Setup | Pin source to the triggering commit
        env:
          RELEASE_SHA: "${{ github.sha }}"
        run: git reset --hard "$RELEASE_SHA"

      - name: Setup | Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup | Install Hatch
        uses: pypa/hatch@257e27e51a6a5616ed08a39a408a21c35c9931bc
        with:
          version: "1.17.1"

      - name: Action | Prepare prerelease version and create tag
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: "${{ github.token }}"
          build: false
          commit: false
          push: true
          tag: true
          vcs_release: false
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Action | Build release
        if: steps.release.outputs.released == 'true'
        run: hatch build --clean

      - name: Action | Upload artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Публикация в PyPI через trusted publishing, без токенов.
  publish-pypi:
    name: Publish prerelease to PyPI
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: "https://pypi.org/project/gocream-pycdek/${{ needs.build.outputs.version }}/"

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Action | Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: prerelease-distributions
          path: dist/

      - name: Publish | Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # GitHub Release с пометкой prerelease, чтобы не подменять latest.
  publish-github:
    name: Publish prerelease to GitHub Release
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Action | Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: prerelease-distributions
          path: dist/

      - name: Publish | Upload to GitHub Release Assets
        env:
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ github.token }}"
          RELEASE_NOTES: "${{ needs.build.outputs.release_notes }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag
          --prerelease
          --title "$RELEASE_TAG"
          --notes "$RELEASE_NOTES"

  # Ветка next получает свою версию доков; только для rc, beta их не трогает.
  documentation:
    name: Deploy next documentation
    needs:
      - setup
      - tests
    if: needs.setup.outputs.channel == 'rc'
    uses: ./.github/workflows/docs.yml
    with:
      ref: "${{ github.sha }}"
      deploy_next: true
    permissions:
      contents: write
