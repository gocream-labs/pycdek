# Воркфлоу стабильного релиза
# Запускается автоматически при пуше в master
# Порядок выполнения:
#   1. Выполняет тесты (ci.yml)
#   2. Билдит пакет
#   3. Публикует пакет в PyPI
#   4. Публикует пакет в GitHub Release
#   5. Запускает билд документации (docs.yml)

name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - CHANGELOG.md
      - gocream_pycdek/__init__.py

permissions:
  contents: read

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  checks:
    name: Check stable candidate
    uses: ./.github/workflows/ci.yml
    with:
      run_tests: true
      run_package: true
      run_lint: false
      run_docs: false
    permissions:
      contents: read

  build:
    name: Build, Version, Commit & Tag [Stable]
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      docs_version: "${{ steps.docs.outputs.docs_version }}"
      release_notes: "${{ steps.release.outputs.release_notes }}"
      released: "${{ steps.release.outputs.released }}"
      tag: "${{ steps.release.outputs.tag }}"
      version: "${{ steps.release.outputs.version }}"

    steps:
      - name: Setup | Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: "${{ vars.RELEASE_APP_CLIENT_ID }}"
          private-key: "${{ secrets.RELEASE_APP_PRIVATE_KEY }}"

      - name: Setup | Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: "${{ steps.release-token.outputs.token }}"

      - name: Setup | Pin master to the tested commit
        env:
          RELEASE_SHA: "${{ github.sha }}"
        run: git reset --hard "$RELEASE_SHA"

      - name: Setup | Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup | Install Hatch
        uses: pypa/hatch@257e27e51a6a5616ed08a39a408a21c35c9931bc
        with:
          version: "1.17.1"

      - name: Action | Create stable release commit and tag
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: "${{ steps.release-token.outputs.token }}"
          build: false
          changelog: true
          commit: true
          push: true
          tag: true
          vcs_release: false
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Action | Select major.minor documentation version
        id: docs
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_VERSION: "${{ steps.release.outputs.version }}"
        run: echo "docs_version=${RELEASE_VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Action | Build release
        if: steps.release.outputs.released == 'true'
        run: hatch build --clean

      - name: Action | Upload artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stable-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish stable distributions to PyPI
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: "https://pypi.org/project/gocream-pycdek/${{ needs.build.outputs.version }}/"

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Action | Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: stable-distributions
          path: dist/

      - name: Publish | Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish stable to GitHub Release
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Action | Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: stable-distributions
          path: dist/

      - name: Publish | Upload to GitHub Release Assets
        env:
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ github.token }}"
          RELEASE_NOTES: "${{ needs.build.outputs.release_notes }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag
          --title "$RELEASE_TAG"
          --notes "$RELEASE_NOTES"

  documentation:
    name: Deploy stable documentation
    needs: build
    if: needs.build.outputs.released == 'true'
    uses: ./.github/workflows/docs.yml
    with:
      ref: "${{ needs.build.outputs.tag }}"
      version: "${{ needs.build.outputs.docs_version }}"
      alias: latest
    permissions:
      contents: write
